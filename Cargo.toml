[package]
name = "judex"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99.1"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
insta = { version = "1", features = ["json"] }
rstest = "0.28"
tempfile = "3"
