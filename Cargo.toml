[package]
name = "judex"
description = "Turns container image vulnerability scans into audit reports"
repository = "https://github.com/jtr860830/image-scan-report"
publish = false
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99.1"

[lib]
name = "image_scan_report"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"

typst = "0.15"
typst-as-lib = { version = "0.17", default-features = false }
typst-pdf = "0.15"
rayon = "1"
toml = "1"

[dev-dependencies]
lopdf = "0.47"
pdf-extract = "0.12"
typst-render = "0.15"
assert_cmd = "2"
insta = { version = "1", features = ["json"] }
rstest = "0.28"
tempfile = "3"
