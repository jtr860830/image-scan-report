[package]
name = "judex"
description = "Turns container image vulnerability scans into audit reports"
repository = "https://github.com/jtr860830/judex"
publish = false
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99.1"

[lib]
name = "image_scan_report"
path = "src/lib.rs"

[features]
preview = ["dep:typst-render"]

[dependencies]
clap = { version = "4", features = ["derive", "string"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
ureq = { version = "3", features = ["json"] }
url = "2"

typst = "0.15"
typst-layout = "0.15"
typst-as-lib = { version = "0.17", default-features = false }
typst-pdf = "0.15"
typst-render = { version = "0.15", optional = true }
rayon = "1"
toml = "1"

[dev-dependencies]
httpmock = "0.9"
lopdf = "0.47"
pdf-extract = "0.12"
image_scan_report = { package = "judex", path = ".", features = ["preview"] }
assert_cmd = "2"
insta = { version = "1", features = ["json"] }
rstest = "0.28"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
missing_docs = "warn"
