name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref_tag:
        description: 'Version label (empty uses the current short SHA); dispatch always publishes only sha-<short>'
        default: ''
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  # the only place the release pipeline names the product; see docs/release.md
  BIN: judex
  IMAGE_NAME: judex

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - id: version
        env:
          REF_TAG: ${{ inputs.ref_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            TAG="$GITHUB_REF_NAME"
            IMAGE_TAG="${TAG#v}"
          else
            TAG="${REF_TAG:-${GITHUB_SHA::7}}"
            IMAGE_TAG="sha-${GITHUB_SHA::7}"
          fi
          [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || exit 1
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  binaries:
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package native binary
        env:
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          tar -czf "dist/${BIN}-${TAG}-${TARGET}.tar.gz" -C target/release "$BIN" -C "$GITHUB_WORKSPACE" LICENSE THIRD_PARTY_NOTICES.md README.md docs/container.md
          cd dist
          sha256sum *.tar.gz > "SHA256SUMS-${TARGET}"
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  image:
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/jtr860830/${{ env.IMAGE_NAME }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: Containerfile
          push: true
          tags: ghcr.io/jtr860830/${{ env.IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.tag }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.target }}
          path: digests/*
          if-no-files-found: error

  manifest:
    needs: [version, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Publish and inspect native multi-arch image
        env:
          VERSION: ${{ needs.version.outputs.image_tag }}
        run: |
          IMAGE="ghcr.io/jtr860830/${IMAGE_NAME}"
          tags=(-t "$IMAGE:$VERSION")
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=(-t "$IMAGE:latest")
          fi
          sources=()
          for digest in digests/*; do
            sources+=("$IMAGE@sha256:${digest##*/}")
          done
          [[ ${#sources[@]} == 2 ]]
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [version, binaries, manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Merge checksums and extract release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat dist/SHA256SUMS-* > dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
          awk -v heading="## [$VERSION] - " '
            index($0, heading) == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
