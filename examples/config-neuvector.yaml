# Connect to NeuVector using a password supplied through the environment.
source:
  type: neuvector
  url: https://neuvector.example.com:10443
  registry: harbor-prod
  username: report-reader
  password_env: NEUVECTOR_PASSWORD
  timeout_secs: 30
  # Last resort when the CA cannot be exported; prints a TLS verification warning.
  # insecure_skip_verify: true
  # Mount your private certificate authority bundle at this path.
  ca_file: /etc/report/neuvector-ca.pem

report:
  language: zh-TW
  organization: Example Organization
  logo: /etc/report/logo.png
  # Scans older than this threshold are marked stale.
  stale_after_days: 30
  pdf: true
  json: false

output:
  # Persist reports to a mounted output directory.
  - type: filesystem
    path: /output
  - type: http
    url: https://reports.example.com/upload
    method: PUT
    headers: { Authorization: "Bearer ${UPLOAD_TOKEN}" }
    mode: raw
    timeout_secs: 30

# Optional directory containing theme.toml and a logo.
# theme:
#   path: ./themes/default
