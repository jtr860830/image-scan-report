# Connect to Harbor using a password supplied through the environment.
source:
  type: harbor
  url: https://harbor.example.com
  project: my-project
  username: report-reader
  password_env: HARBOR_PASSWORD
  # Mount your private certificate authority bundle at this path.
  ca_file: /etc/report/harbor-ca.pem

report:
  language: zh-TW
  organization: Example Organization
  logo: /etc/report/logo.png
  # Scans older than this threshold are marked stale.
  stale_after_days: 30
  pdf: true
  json: false

output:
  # Persist reports to a mounted output directory.
  - type: filesystem
    path: /output
  # Upload each report as the raw request body.
  - type: http
    url: https://reports.example.com/upload
    method: PUT
    headers: { Authorization: "Bearer ${UPLOAD_TOKEN}" }
    mode: raw
    timeout_secs: 30

# Optional directory containing theme.toml and a logo.
# theme:
#   path: ./themes/default
