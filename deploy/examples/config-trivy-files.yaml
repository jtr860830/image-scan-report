# For containers, mount scans at /var/lib/judex/scans and reports at
# /var/lib/judex/reports; use /var/lib/judex/scans/trivy as the source path.
source:
  type: trivy-files
  path: ./tests/fixtures/trivy
report:
  language: en
  organization: "Example Org"
  json: true
  pdf: true
output:
  - type: filesystem
    path: ./out

# Optional directory containing theme.toml and a logo.
# theme:
#   path: ./assets/themes/default
