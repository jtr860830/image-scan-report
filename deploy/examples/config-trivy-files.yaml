# For container use, set source.path to /var/lib/judex/scans/trivy and
# output.path to /var/lib/judex/reports.
source:
  type: trivy-files
  path: ./tests/fixtures/trivy
report:
  language: en
  organization: "Example Org"
  json: true
  pdf: true
output:
  - type: filesystem
    path: ./out

