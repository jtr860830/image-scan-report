apiVersion: v1
kind: ConfigMap
metadata:
  name: report-config
  namespace: image-scan-report
  labels:
    app.kubernetes.io/name: image-scan-report
data:
  config.yaml: |
    source:
      type: harbor
      url: https://harbor.example.com
      project: my-project
      username: report-reader
      password_env: HARBOR_PASSWORD
      ca_file: /etc/report/ca.pem
    report:
      language: zh-TW
      organization: Example Organization
      stale_after_days: 30
      json: true
    output:
      - type: filesystem
        path: /output
