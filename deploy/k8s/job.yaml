apiVersion: batch/v1
kind: Job
metadata:
  name: judex-once
  namespace: judex
  labels:
    app.kubernetes.io/name: judex
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: judex
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: report
          image: ghcr.io/jtr860830/judex:0.2.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          envFrom:
            - secretRef:
                name: report-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/judex/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: ca
              mountPath: /etc/judex/ca.pem
              subPath: ca.pem
              readOnly: true
            - name: output
              mountPath: /var/lib/judex/reports
      volumes:
        - name: config
          configMap:
            name: report-config
        - name: ca
          configMap:
            name: harbor-ca
            optional: true
        - name: output
          persistentVolumeClaim:
            claimName: report-output
